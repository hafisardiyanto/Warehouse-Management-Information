version: '3.8'
services:
  warehouse_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/warehouse-app
    container_name: warehouse_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - warehouse_public_build:/var/www/html/public/build
    environment:
      APP_NAME: "Warehouse Management Information"
      APP_ENV: production
      APP_KEY: "base64:b1Z0X9JMeJ9Q4s4v75C4ZRcwGESN4lbGmx5zxXLHxx8="
      APP_DEBUG: "true"
      APP_URL: "http://43.133.157.230:8082"
      DB_CONNECTION: mysql
      DB_HOST: warehouse_db
      DB_PORT: 3306
      DB_DATABASE: laravelgudang
      DB_USERNAME: root
      DB_PASSWORD: ""
    networks:
      - warehouse_network

  warehouse_nginx:
    image: nginx:alpine
    container_name: warehouse_web
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - warehouse_public_build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - warehouse_app
    networks:
      - warehouse_network

  warehouse_db:
    image: mysql:8.0
    container_name: warehouse_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravelgudang
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - warehouse_dbdata:/var/lib/mysql
    networks:
      - warehouse_network

  warehouse_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: warehouse_phpmyadmin
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      PMA_HOST: warehouse_db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ""
    networks:
      - warehouse_network
    depends_on:
      - warehouse_db

networks:
  warehouse_network:
    driver: bridge

volumes:
  warehouse_dbdata:
    driver: local
  warehouse_public_build:
