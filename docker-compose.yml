version: '3.8'
services:
  warehouse_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/warehouse-app
    container_name: warehouse_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - warehouse_network

  warehouse_nginx:
    image: nginx:alpine
    container_name: warehouse_web
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - warehouse_app
    networks:
      - warehouse_network

  warehouse_db:
    image: mysql:8.0
    container_name: warehouse_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USER}
    volumes:
      - warehouse_dbdata:/var/lib/mysql
    networks:
      - warehouse_network

  warehouse_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: warehouse_phpmyadmin
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      PMA_HOST: warehouse_db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - warehouse_network
    depends_on:
      - warehouse_db

networks:
  warehouse_network:
    driver: bridge

volumes:
  warehouse_dbdata:
    driver: local
